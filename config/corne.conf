# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Boost the Bluetooth transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Trades some power efficiency for a more stable Bluetooth connection
CONFIG_BT_CTLR_PHY_2M=n

# Something Typeractive wants me to enable to see if it fixes connectivity issues
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Enable experimental Bluetooth connection support
# This is in an attempt to fix poor connection issues with PopOS
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Attempting to fix my keyboard
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# DEBUG - clear all Bluetooth bonds
# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
